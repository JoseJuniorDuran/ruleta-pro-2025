<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ruleta Pro 2026 — Sorteo Premium</title>
    <meta name="description" content="Plataforma de sorteos premium con animación cinematográfica de nivel profesional.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
</head>
<body>
    <!-- Particle canvas background -->
    <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>

    <!-- Ambient light effects -->
    <div class="ambient" aria-hidden="true">
        <div class="ambient__orb ambient__orb--1"></div>
        <div class="ambient__orb ambient__orb--2"></div>
        <div class="ambient__orb ambient__orb--3"></div>
        <div class="ambient__orb ambient__orb--4"></div>
        <div class="ambient__grain"></div>
    </div>

    <!-- Navigation -->
    <nav class="nav" id="nav">
        <div class="nav__left">
            <div class="nav__logo">
                <div class="nav__logo-icon">
                    <svg viewBox="0 0 32 32" fill="none">
                        <rect x="2" y="2" width="28" height="28" rx="8" stroke="url(#navGrad)" stroke-width="2"/>
                        <circle cx="16" cy="16" r="6" fill="url(#navGrad)"/>
                        <defs>
                            <linearGradient id="navGrad" x1="0" y1="0" x2="32" y2="32">
                                <stop stop-color="#a855f7"/>
                                <stop offset="1" stop-color="#6366f1"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="nav__wordmark">Ruleta<em>Pro</em></span>
            </div>
        </div>
        <div class="nav__center">
            <span class="nav__status" id="navStatus">
                <span class="nav__status-dot"></span>
                Sistema Listo
            </span>
        </div>
        <div class="nav__right">
            <span class="nav__badge">Premium</span>
            <span class="nav__year">2026</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <!-- Left Panel: Controls -->
        <section class="panel panel--controls">
            <div class="panel__header">
                <span class="panel__tag">01 — Configurar</span>
                <h2 class="panel__title">Participantes</h2>
                <p class="panel__desc">Agrega los nombres de los participantes, uno por linea.</p>
            </div>

            <div class="editor">
                <div class="editor__bar">
                    <div class="editor__dots">
                        <span class="editor__dot editor__dot--r"></span>
                        <span class="editor__dot editor__dot--y"></span>
                        <span class="editor__dot editor__dot--g"></span>
                    </div>
                    <span class="editor__filename">participantes.txt</span>
                    <span class="editor__count" id="count">0</span>
                </div>
                <textarea id="participants" class="editor__textarea" spellcheck="false" autocomplete="off">Jose Junior
Maria
Pepe
Lucia
Carlos
Ana
Sofia
Miguel
Valentina
Diego
Carmen
Fernando
Isabella
Andres</textarea>
            </div>

            <div class="actions">
                <div class="actions__header">
                    <span class="panel__tag">02 — Ejecutar</span>
                    <h2 class="panel__title panel__title--sm">Sorteo</h2>
                </div>
                <div class="actions__btns">
                    <button id="spinBtn" class="btn btn--spin" aria-label="Iniciar sorteo">
                        <span class="btn__glow"></span>
                        <span class="btn__content">
                            <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            <span class="btn__text">Iniciar Sorteo</span>
                        </span>
                    </button>
                    <button id="resetBtn" class="btn btn--reset" aria-label="Reiniciar">
                        <svg class="btn__icon btn__icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1 4 1 10 7 10"/>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Right Panel: Display -->
        <section class="panel panel--display">
            <!-- Status Bar -->
            <div class="display__status">
                <div class="display__status-left">
                    <span class="display__status-dot" id="statusDot"></span>
                    <span class="display__status-text" id="statusText">En espera</span>
                </div>
                <div class="display__status-right">
                    <span class="display__status-timer" id="statusTimer"></span>
                    <span class="display__status-count" id="displayCount">14 participantes</span>
                </div>
            </div>

            <!-- Horizontal Scroll Display -->
            <div class="display" id="display">
                <div class="display__viewport" id="viewport">
                    <div class="display__selector">
                        <div class="display__selector-glow"></div>
                    </div>
                    <div class="display__track" id="track">
                        <!-- Names rendered by JS -->
                    </div>
                </div>
                <!-- Progress -->
                <div class="display__progress">
                    <div class="display__progress-bar" id="progressBar"></div>
                </div>
            </div>

            <!-- Winner Reveal -->
            <div id="result" class="winner hidden">
                <div class="winner__spotlight"></div>
                <div class="winner__content">
                    <div class="winner__crown">
                        <svg viewBox="0 0 48 48" fill="none">
                            <path d="M6 32L10 14L18 22L24 8L30 22L38 14L42 32H6Z" fill="url(#crownGrad)" opacity="0.9"/>
                            <path d="M6 32H42V36C42 38.2 40.2 40 38 40H10C7.8 40 6 38.2 6 36V32Z" fill="url(#crownGrad)"/>
                            <circle cx="10" cy="14" r="3" fill="#fbbf24"/>
                            <circle cx="24" cy="8" r="3" fill="#fbbf24"/>
                            <circle cx="38" cy="14" r="3" fill="#fbbf24"/>
                            <defs>
                                <linearGradient id="crownGrad" x1="6" y1="8" x2="42" y2="40">
                                    <stop stop-color="#fbbf24"/>
                                    <stop offset="1" stop-color="#f59e0b"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="winner__label">Ganador del Sorteo</span>
                    <h2 class="winner__name" id="winnerName">---</h2>
                    <div class="winner__divider"></div>
                    <button id="newSorteoBtn" class="btn btn--new">Nuevo Sorteo</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer__inner">
            <span class="footer__brand">Ruleta Pro 2026</span>
            <span class="footer__sep"></span>
            <span class="footer__credit">Creado por Jose Junior Duran</span>
        </div>
    </footer>

    <!-- Confetti canvas -->
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <script src="js/app.js"></script>
</body>
</html>
